<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A little love from home 🐀</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #edf7ed;
      background-image:
        radial-gradient(circle at 15% 25%, #d4efd4 0%, transparent 40%),
        radial-gradient(circle at 85% 70%, #c8e8c8 0%, transparent 40%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', Georgia, serif;
      color: #0c2707;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .header-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 700;
      color: #064406;
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #407540;
      font-style: italic;
      margin-bottom: 2rem;
    }

    .card {
      background: #b8ddb8;
      border: 1.5px solid #508b50;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.3s ease;
    }

    .card::before {
      content: '\201C';
      font-family: 'Caveat', cursive;
      font-size: 7rem;
      color: #183f10;
      position: absolute;
      top: -1.5rem;
      left: 1.5rem;
      line-height: 1;
      pointer-events: none;
    }

    .photo-wrap {
      width: min(420px, 85vw);
      height: min(420px, 85vw);
      border-radius: 16px;
      overflow: hidden;
      border: 3px solid #183f10;
      margin-bottom: 1.25rem;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.45s ease, transform 0.45s ease;
      background: #dfffd9;
    }

    .photo-wrap.visible {
      opacity: 1;
      transform: scale(1);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .quote-text {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      line-height: 1.75;
      color: #0c2707;
      font-style: italic;
      margin-bottom: 1.25rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      white-space: pre-line;
    }

    .quote-author {
      font-family: 'Caveat', cursive;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 700;
      color: #064406;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
    }

    .quote-text.visible,
    .quote-author.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .btn {
      display: inline-block;
      background: #064406;
      color: #b8ddb8;
      font-family: 'Caveat', cursive;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 700;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, transform 0.15s ease;
      box-shadow: 0 4px 0 #022002;
      width: min(320px, 90vw);
    }

    .btn:hover { background: #0d6b0d; }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #022002;
    }

    .counter {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #407540;
      font-style: italic;
    }

    footer {
      margin-top: 3rem;
      color: #407540;
      font-family: 'Caveat', cursive;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="header-icon">🐀</span>
    <h1>A little love from home</h1>
    <p class="subtitle">For whenever you miss home pookie bear</p>

    <div class="card" id="card">
      <div class="photo-wrap visible" id="photoWrap">
        <img id="quotePhoto" src="images/zigandoz2.jpg" alt="Welcome" />
      </div>
      <p class="quote-text visible" id="quoteText">Press the button!!</p>
      <span class="quote-author visible" id="quoteAuthor"></span>
    </div>

    <button class="btn" id="quoteBtn" onclick="showQuote()">
      Send me words of wisdom
    </button>

    <p class="counter" id="counter"></p>

    <footer><span></span></footer>
  </div>

  <script>
    const quotes = [
      { text: "You are so brave and strong", author: "— Zoe", photo: "images/raceway.jpg" },
      { text: "Remember you're an american", author: "— Zoe", photo: "images/niagara.jpg" },
      { text: "Remember when you put the rat on the wall by the neck", author: "— Zoe", photo: "images/ratwall.jpg" },
      { text: "I miss you pookie but am so proud of you", author: "— Zoe", photo: "images/couch.jpg" },
      { text: "All you need is the rat", author: "— Zoe", photo: "images/ratpeep.jpg" },
      { text: "You're going to be so educated", author: "— Zoe", photo: "images/ztaaescape.jpg" },
      { text: "My pookie my pookie you're my pookie you're my pookie", author: "— Zoe", photo: "images/paddleBoard.jpg" },
      { text: "Rats rats we are the rats", author: "— Zoe", photo: "images/ratmusic.jpg" },
      { text: "Remember to practice your english, don't want to be forgetting that", author: "— Zoe", photo: "images/patio.jpg" },
      { text: "Grungle fuck", author: "— Zoe", photo: "images/grungle.png" },
      { text: "I love you", author: "— Zoe", photo: "images/cards.jpg" },
      { text: "at least you can't vom in our sink", author: "— Tom", photo: "images/zoetomabby.jpg" },
      { text: "can't wait for you to come back already", author: "— Tom", photo: "images/ztariver.jpg" },
      { text: "grungle ... fuck", author: "— Tom", photo: "images/grungle.png" },
      { text: "don't stop singing random things abruptly, its part of your charm", author: "— Tom", photo: "images/swimmeet.jpg" },
      { text: "try not to intimidate the Spaniards with you towering presence", author: "— Tom", photo: "images/abbyandzig.jpg" },
      { text: "maybe you'll grow taller", author: "— Zoe", photo: "images/zigandoz.jpg" },
      { text: "cool planeride inbound", author: "— Zoe", photo: "images/plane.jpg" },
      { text: "Remember - This is your world, we are all just living in it.", author: "— Nic", photo: "images/abbynichannah.jpg" },
      { text: "Time did not exist before Abby.", author: "— Nic", photo: "images/crown.jpg" },
      { text: "give the spanish a taste of american FREEDOM RAHH", author: "— Ethan", photo: "images/ozandgin.jpg" },
      { text: "hacer mucho fiesta amigo", author: "— Ethan", photo: "images/coolozzie.jpg" },
      { text: "google's #1 tip to bullfighting is \"read the bull\", glhf!", author: "— Ethan", photo: "images/abandoz.jpg" },
      { text: "Mom's Top 5 Dos and Don'ts while studying abroad in Spain: \n1. DO: Try to say yes to new experiences. This may be your only time living out of the states, try to make the most of your cultural immersion! Try new foods and drinks and excursions. Get yourself out of your comfort zone! *But remember your mom says always be mindful of your safety and security when doing new things.", author: "— Mom", photo: "images/family.jpg", photoFit: "contain" },
      { text: "Mom's Top 5 Dos and Don'ts while studying abroad in Spain: \n2. DON'T: Feel pressure to mirror other people's study abroad experience. Do what YOU want to do!", author: "— Mom", photo: "images/ginny.jpg" },
      { text: "Mom's Top 5 Dos and Don'ts while studying abroad in Spain: \n3. DON'T: Fall for scams. Whether it's in Valladolid or on a trip, be very aware of common scams that you may encounter. There are many people that will try in a lot of creative ways to get your money. Be safe and stick together!", author: "— Mom", photo: "images/siblings.jpg", photoFit: "contain" },
      { text: "Mom's Top 5 Dos and Don'ts while studying abroad in Spain: \n4. DO: Remember to be grateful and have fun! Studying abroad is such a privilege. Keep on top of your studies while abroad but don't forget that above all this experience is supposed to be fun. Make new friends, see new places, try new foods, and overall just live your life to the fullest.", author: "— Mom", photo: "images/present.jpg" },
      { text: "Mom's Top 5 Dos and Don'ts while studying abroad in Spain: \n5. DON'T: Let your fears deter you from making the most of your study abroad experience.  You will grow so much confidence over the next few months and have some of the most magical experiences of your life. Being able to come home and tell all the stories to family and friends will be so amazing. Will it be difficult at times? Absolutely. Will you get homesick? Yes, hopefully only on a few occasions. Know the rough patches will pass and be replaced by good memories. You are strong and brave and can do anything! ❤️❤️❤️", author: "— Mom", photo: "images/abandkelly.jpg" },
    ];

    let lastIndex = -1;
    let shown = 0;

    function showQuote() {
      const textEl    = document.getElementById('quoteText');
      const authorEl  = document.getElementById('quoteAuthor');
      const photoWrap = document.getElementById('photoWrap');
      const photoImg  = document.getElementById('quotePhoto');

      textEl.classList.remove('visible');
      authorEl.classList.remove('visible');
      photoWrap.classList.remove('visible');

      setTimeout(() => {
        let idx;
        do { idx = Math.floor(Math.random() * quotes.length); }
        while (idx === lastIndex && quotes.length > 1);
        lastIndex = idx;

        const q = quotes[idx];
        textEl.textContent = q.text;
        authorEl.textContent = q.author;

        if (q.photo) {
          photoImg.src = q.photo;
          photoImg.alt = q.author.replace('— ', '');
          photoWrap.style.display = 'block';
          if (q.photoFit === 'contain') {
            photoWrap.style.width = 'min(420px, 85vw)';
            photoWrap.style.height = 'auto';
            photoImg.style.objectFit = 'contain';
            photoImg.style.width = '100%';
            photoImg.style.height = 'auto';
          } else {
            photoWrap.style.width = '';
            photoWrap.style.height = '';
            photoImg.style.objectFit = 'cover';
            photoImg.style.width = '100%';
            photoImg.style.height = '100%';
          }
          setTimeout(() => photoWrap.classList.add('visible'), 20);
        } else {
          photoWrap.style.display = 'none';
        }

        textEl.classList.add('visible');
        authorEl.classList.add('visible');

        shown++;
        const counter = document.getElementById('counter');
        counter.textContent = shown === 1
          ? "One message of love delivered 🦒"
          : `${shown} bars of love so far 💚`;

      }, 220);
    }
  </script>

</body>
</html>
